[workspace]
members = [".", "experiments/runner"]
resolver = "2"

# Workspace-shared dependencies — see CORPUS_PROVENANCE.md for the
# rationale on pinning `rand` to "=0.8.5". Hoisting here closes the
# silent-drift hazard where the root crate and experiments/runner could
# carry different `rand` pins (Round 2 team review, rust-craftsman item
# 5 + qa-sentinel Y2).
[workspace.dependencies]
# =0.8.5 exact — load-bearing for StdRng sequence stability across CI
# runs (see tests/cond_d_falsifier.rs; a future ^0.8 loosening could
# silently flake the Cond D falsifier as StdRng byte output changes).
rand = "=0.8.5"

[package]
name = "koru-lambda-core"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
description = "A minimal axiomatic system for distributed computation"
authors = ["Sawyer Kent <sawyerkent.me@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/swyrknt/koru-lambda-core"
keywords = ["distributed", "consensus", "wasm", "deterministic"]
categories = ["algorithms", "wasm"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
panic = "abort"

[lints.rust]
# `cfg(loom)` is a workflow-specific build flag set via
# `RUSTFLAGS="--cfg loom"` when running the loom model-checker tests
# in `tests/loom_kernel.rs` (DESIGN.md gate 24). `cfg(loom_mutant)`
# additionally enables the regression-sentinel kernel that downgrades
# the writer's fetch_add to Relaxed and expects loom to detect it.
# Both declared here so the unexpected_cfgs lint passes when neither
# flag is set.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(loom_mutant)'] }

[dependencies]
sha2 = "0.10"
dashmap = "6.0"
hex = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
lru = "0.12"

# WASM support (Step 3)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# `serde_bytes` — Uint8Array bridge for wasm-bindgen POJOs (R11).
# Default `serde-wasm-bindgen` serializes `Vec<u8>` as `Array<number>`;
# `#[serde(with = "serde_bytes")]` restores the expected Uint8Array shape.
serde_bytes = { version = "0.11", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys", "console_error_panic_hook", "serde_bytes"]

[[bench]]
name = "substrate"
harness = false

[[bench]]
name = "upper_bound"
harness = false

[[bench]]
name = "perspective"
harness = false

[dev-dependencies]
# Universally-safe dev-deps — compile fine on both native and wasm32.
static_assertions = "1"
serde_json = "1.0"

# Native-only dev-deps. `proptest`, `criterion`, `loom`, `dhat`, `trybuild`
# all have wasm-hostile transitive deps (`wait-timeout`, native FFI, etc.);
# scoping them to non-wasm32 lets `wasm-pack test --features wasm` compile
# `tests/wasm_smoke.rs` without dragging their broken transitives onto the
# wasm target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"
proptest = "1.0"
rand = { workspace = true } # see [workspace.dependencies] for the pin rationale
loom = "0.7"
dhat = "0.3"
# `trybuild` — compile-fail harness used by `tests/trybuild.rs` to prove
# `dyn Signal` is object-unsafe by design (PROJECTION_SPEC §3.1).
trybuild = "1"

# wasm32-only dev-deps.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# `wasm-bindgen-test` — smoke suite for `src/wasm.rs` at `tests/wasm_smoke.rs`.
# Runs via `wasm-pack test --node --features wasm`.
wasm-bindgen-test = "0.3"
# Note: koru-experiments-runner is a workspace member (see [workspace]
# above) but NOT a dev-dependency of the root crate — that edge, combined
# with experiments/runner → koru-lambda-core (normal dep), created a
# crate-graph cycle that broke rust-analyzer's macro resolution. The
# Coding Law ρ gate test that used to live at `tests/coding_law.rs` now
# lives at `experiments/runner/tests/coding_law.rs`, where the
# dependency direction is naturally one-way (experiments → core).

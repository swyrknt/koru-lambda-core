[package]
name = "koru-lambda-core"
version = "2.0.0"
edition = "2021"
description = "A minimal axiomatic system for distributed computation"
authors = ["Sawyer Kent <sawyerkent.me@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/swyrknt/koru-lambda-core"
keywords = ["distributed", "consensus", "wasm", "deterministic"]
categories = ["algorithms", "wasm"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dashmap = "6.0"
rayon = "1.10"
lru = "0.16"
once_cell = "1.19"
hex = "0.4"
crossbeam-queue = "0.3"

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
# W5 / Decision 5.6: always-on under the wasm feature.
# Sets up `console.error` panic hooks so panics in WASM code surface as
# readable stack traces in the JS console instead of opaque
# `RuntimeError: unreachable executed`.
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
wasm = [
    "wasm-bindgen",
    "serde-wasm-bindgen",
    "js-sys",
    "console_error_panic_hook",
]

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
petgraph = "0.6"
rand = "0.8"
# W13 closure (CHECKLIST 1.8 / Phase 6 sub-branch #10). Lets WASM
# tests run under `wasm-pack test --node` (or any other
# wasm-bindgen-test driver) instead of pretending to be host-side
# `#[test]`s — the v1.2.0 layout compiled but exercised the native
# Rust code path, not the WASM runtime.
wasm-bindgen-test = "0.3"

[[bench]]
name = "performance"
harness = false

# Release-profile panic strategy.
#
# F1 / F3 closure (CHECKLIST 1.7 / Phase 6 sub-branch #8). The crate's
# C ABI (`#[no_mangle] pub unsafe extern "C" fn ...`) is compiled into
# both `cdylib` and `staticlib` artifacts loaded by Go / Kotlin / Swift
# runtimes. Unwinding across an `extern "C"` frame is UB under the
# default `panic = "unwind"` strategy. Switching the release profile to
# `panic = "abort"` makes every panic that reaches an FFI boundary
# terminate the process deterministically rather than corrupt foreign
# stacks.
#
# `cargo test` (whether `--release` or not) and `cargo bench` continue
# to unwind: Cargo intentionally ignores the `panic` setting for the
# `test` and `bench` profiles because their harnesses depend on
# `std::panic::catch_unwind`. Tests can therefore still use
# `#[should_panic]` and Criterion bench harnesses link normally.
[profile.release]
panic = "abort"
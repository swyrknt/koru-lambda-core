[package]
name = "distinction-engine"
version = "0.1.0"
edition = "2021"
description = "A minimal axiomatic system for emergent computation"
authors = ["Your Name <email@domain.com>"]
license = "MIT OR Apache-2.0"
readme = "DESIGN_DOC.md"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
dashmap = "6.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "mdns",
    "noise",
    "yamux",
    "tcp",
    "quic",
    "macros",
] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
petgraph = "0.6"
rand = "0.8"

[[bench]]
name = "performance"
harness = false
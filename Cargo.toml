[workspace]
members = [".", "experiments/runner"]
resolver = "2"

[package]
name = "koru-lambda-core"
version = "1.2.0"
edition = "2021"
rust-version = "1.80"
description = "A minimal axiomatic system for distributed computation"
authors = ["Sawyer Kent <sawyerkent.me@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/swyrknt/koru-lambda-core"
keywords = ["distributed", "consensus", "wasm", "deterministic"]
categories = ["algorithms", "wasm"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
panic = "abort"

[lints.rust]
# `cfg(loom)` is a workflow-specific build flag set via
# `RUSTFLAGS="--cfg loom"` when running the loom model-checker tests
# in `tests/loom_kernel.rs` (DESIGN.md gate 24). Declared here so the
# unexpected_cfgs lint passes without `--cfg loom` set.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
sha2 = "0.10"
dashmap = "6.0"
hex = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

# WASM support (Step 3)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys", "console_error_panic_hook"]

# cbindgen returns in Step 3 (FFI bindings); deferred to keep
# sub-milestone 1a build clean.

[[bench]]
name = "substrate"
harness = false

[[bench]]
name = "upper_bound"
harness = false

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
rand = "=0.8.5"          # exact-version pin for exp18 corpus reproducibility
static_assertions = "1"
loom = "0.7"
dhat = "0.3"
blake3 = "1"
serde_json = "1.0"
# Workspace member — provides the reusable Coding Law workload module
# consumed by `tests/coding_law.rs`. Step 4 will import the same module
# at scale.
koru-experiments-runner = { path = "experiments/runner" }

# benches/performance.rs deleted in pre-flight (v1.2 String-API bench).
# Step 1 creates benches/substrate.rs against the v2.0 byte-API surface.

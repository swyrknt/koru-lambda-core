[package]
name = "distinction-engine"
version = "0.1.0"
edition = "2021"
description = "A minimal axiomatic system for emergent computation"
authors = ["Your Name <email@domain.com>"]
license = "MIT OR Apache-2.0"
readme = "DESIGN_DOC.md"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dashmap = "6.0"
rayon = "1.10"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
petgraph = "0.6"
rand = "0.8"

[[bench]]
name = "performance"
harness = false
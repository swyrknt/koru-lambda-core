[workspace]
members = [".", "crates/koru-lambda-agents", "crates/koru-lambda-wasm", "experiments/runner"]
resolver = "2"

# Workspace-shared dependencies — see CORPUS_PROVENANCE.md for the
# rationale on pinning `rand` to "=0.9.5". Hoisting here closes the
# silent-drift hazard where the root crate and experiments/runner could
# carry different `rand` pins.
[workspace.dependencies]
# Exact pin — load-bearing for StdRng sequence stability across CI runs
# (see tests/cond_d_falsifier.rs; a loosened requirement could silently
# flake the cross-engine falsifier as StdRng byte output changes) and for
# the pinned coding-law corpus (see CORPUS_PROVENANCE.md).
rand = "=0.9.5"

[package]
name = "koru-lambda-core"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
description = "A minimal axiomatic system for distributed computation"
authors = ["Sawyer Kent <sawyerkent.me@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/swyrknt/koru-lambda-core"
keywords = ["distributed", "consensus", "wasm", "deterministic"]
categories = ["algorithms", "wasm"]
# Keep the JS/TS example scaffold in the git repo, out of the crates.io
# tarball. `examples/wasm-demos/` targets external discoverers landing
# on npmjs.com, not crates.io consumers. The `examples/*.rs` binaries
# (01_hello_synth, 02_novelty_and_chain, 03_projection_composition,
# 04_wire_format_roundtrip) ship in the tarball by default — cargo
# convention.
# What a consumer gets: the source, the normative specification, the
# conformance fixture they certify against, and the documents README links to.
# Everything below is this repository's own machinery, and `cargo package
# --list` was shipping 92 files of which 32 were internal — the entire gate
# suite (six of which read the excluded CHECKLIST.md, so they could not run
# from an installed crate), the API review snapshots including the record of
# 1,352 items removed since 1.2.0, proptest failure seeds, the internal
# onboarding docs (one of which still prints v1.2's five-axiom set, and one of
# which preserves deleted marketing prose verbatim), and a .gitignore naming
# local tooling directories.
exclude = [
    "examples/wasm-demos/*",
    "/CHECKLIST.md",
    "/BUDGET_LOG.md",
    "/ROADMAP.md",
    "/CORPUS_PROVENANCE.md",
    "/.gitignore",
    ".github/*",
    "api/*",
    "docs/development/*",
    "proptest-regressions/*",
    "scripts/*",
    "experiments/*",
    # DESIGN.md is "the v2.0 plan" — a planning document for the release being
    # made. Shipping it hands a consumer 749 lines about how 2.0.0 was going to
    # be built, which is the same class as the gate scripts and API review
    # snapshots excluded above; it was missed because that pass looked at
    # directories and not at .md files.
    "/DESIGN.md",
    # A migration guide for the npm package deferred to the agent layer. It now
    # describes an artifact 2.0.0 does not publish.
    "docs/MIGRATION_JS.md",
]

[package.metadata.docs.rs]
# Without this docs.rs builds with default features and half the surface
# silently vanishes from the published documentation.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[profile.release]
panic = "abort"

[lints.rust]
# `cfg(loom)` is a workflow-specific build flag set via
# `RUSTFLAGS="--cfg loom"` when running the loom model-checker tests
# in `tests/loom_kernel.rs` (DESIGN.md gate 24). `cfg(loom_mutant)`
# additionally enables the regression-sentinel kernel that downgrades
# the writer's fetch_add to Relaxed and expects loom to detect it.
# Both declared here so the unexpected_cfgs lint passes when neither
# flag is set.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(loom_mutant)'] }

[dependencies]
sha2 = "0.10"
dashmap = "6.0"
hex = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }


[features]
default = []
# Hex serde adapters for `Distinction` / `RawDistinctionId`. Optional so a
# substrate consumer that does not serialize ids carries no serde tree.
serde = ["dep:serde"]

[[bench]]
name = "substrate"
harness = false

[[bench]]
name = "upper_bound"
harness = false

[[bench]]
name = "perspective"
harness = false

[dev-dependencies]
# Universally-safe dev-deps — compile fine on both native and wasm32.
static_assertions = "1"
# Dev-only, and deliberately so. `bytemuck` was a MANDATORY dependency,
# carried solely for `Pod`/`Zeroable` derives on the two identifier types.
# Both derives are gone — `Distinction`'s because a zero-copy cast is a hole
# in the trust boundary, `RawDistinctionId`'s because it existed for a
# zero-copy path over `&[Distinction]` that stopped being possible when
# `Distinction` lost its own. It stays here only so the static assertions can
# name the traits they assert the ABSENCE of, which costs a consumer nothing.
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1.0"

# Native-only dev-deps. `proptest`, `criterion`, `loom`, `dhat`, `trybuild`
# all have wasm-hostile transitive deps (`wait-timeout`, native FFI, etc.);
# scoping them to non-wasm32 keeps their transitives off the wasm target
# when the bindings crate is built, without dragging them onto the
# wasm target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"
proptest = "1.0"
rand = { workspace = true } # see [workspace.dependencies] for the pin rationale
loom = "0.7"
dhat = "0.3"
# `trybuild` — compile-fail harness used by `tests/trybuild.rs` to prove
# `dyn Signal` is object-unsafe by design (docs/SPEC.md §6).
trybuild = "1"

# wasm32-only dev-deps.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# `wasm-bindgen-test` — retained for wasm32 builds of this crate's own
# targets. The bindings and their smoke suite live in
# `crates/koru-lambda-wasm`, which runs `wasm-pack test --node`.
wasm-bindgen-test = "0.3"
# Note: koru-experiments-runner is a workspace member (see [workspace]
# above) but NOT a dev-dependency of the root crate — that edge, combined
# with experiments/runner → koru-lambda-core (normal dep), created a
# crate-graph cycle that broke rust-analyzer's macro resolution. The
# Coding Law ρ gate test that used to live at `tests/coding_law.rs` now
# lives at `experiments/runner/tests/coding_law.rs`, where the
# dependency direction is naturally one-way (experiments → core).

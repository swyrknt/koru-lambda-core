[package]
name = "koru-lambda-core"
version = "1.2.0"
edition = "2021"
description = "A minimal axiomatic system for distributed computation"
authors = ["Sawyer Kent <sawyerkent.me@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/swyrknt/koru-lambda-core"
keywords = ["distributed", "consensus", "wasm", "deterministic"]
categories = ["algorithms", "wasm"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dashmap = "6.0"
rayon = "1.10"
lru = "0.16"
once_cell = "1.19"

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys"]

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
petgraph = "0.6"
rand = "0.8"

# benches/performance.rs deleted in pre-flight (v1.2 String-API bench).
# Step 1 creates benches/substrate.rs against the v2.0 byte-API surface.
# BASELINE_DEV_M3_PRO
#
# Pre-flight measurement of dev HEAD's performance and memory footprint.
# Captured before Step 1 of the v2.0 substrate work begins. Every future
# budget amendment per DESIGN.md Part 10.5 cites regression delta against
# this baseline.
#
# Status: SCAFFOLD — values below are placeholders. Run the capture
# procedure documented in DESIGN.md Part 10.5 to populate.

[platform]
machine = "Apple M3 Pro"           # update with exact model identifier
cpu_cores = 8                       # 6 performance + 4 efficiency = 10 total; pin actual chip
ram_gb = 16                         # or 18, 32 — pin actual
os = "macOS"                        # pin exact: e.g., "macOS 14.x"
allocator = "system"                # macOS default; NOT jemalloc

[harness]
dev_commit = "c2d331b"              # Update README — current dev HEAD at v2.0 cut
rust_version = "1.80.0"              # pin actual installed version
cargo_command = "cargo bench --bench performance --release"
criterion_measurement_time_seconds = 20
criterion_sample_size = 100
criterion_warm_up_time_seconds = 5
thermal_cooldown_minutes = 5         # idle between runs
not_during_charging = true
capture_window_minutes = 30          # complete all measurements within one thermal envelope

[results.throughput_single_thread]
# Captured from criterion median over 100 samples
target_metric = "engine.synthesize(a, b) cold path, single-thread"
unit = "ops/sec"
measured = 0.0                       # TODO: populate after run
target_v2 = 450000                   # DESIGN.md gate 11
floor_v2 = 300000                    # DESIGN.md gate 11 hard-cap floor

[results.throughput_8_thread]
target_metric = "engine.synthesize(a, b), 8 worker threads, shared engine"
unit = "ops/sec"
measured = 0.0                       # TODO: populate after run
target_v2_absolute = 12000000        # DESIGN.md gate 12
target_v2_ratio = 4                  # DESIGN.md gate 12 (≥ 4× single-thread)
floor_v2_absolute = 8000000          # DESIGN.md gate 12 hard-cap floor

[results.memory_per_distinction]
target_metric = "dhat live-heap per distinction at 1M scale, steady state"
unit = "bytes"
measured = 0.0                       # TODO: populate after dhat-instrumented binary run
target_v2 = 180                      # DESIGN.md gate 13 (includes DashMap shard slack)
floor_v2 = 220                       # DESIGN.md gate 13 hard-cap floor
dhat_alloc_swap_note = """
dhat requires #[global_allocator] = dhat::Alloc. The swap is NOT in dev's
main code path. Build a sibling worktree of dev HEAD; add the global_allocator
swap to a measurement binary at experiments/dhat_capture/src/main.rs; build
with --release; run and capture dhat live-heap output at 1M synth steady
state. Do NOT commit the swap back to dev.
"""

[results.notes]
# Free-form notes from the capture session: anomalies, retries, thermal
# observations, anything that would affect interpretation.
notes = """
TODO: populate after capture run.
"""

[v2_gates_baselined_against_dev]
# Which Part 10 budget gates use this baseline for amendment-PR regression deltas.
gates = [11, 12, 13]
# Gates 14 (Fold Law) and 15 (Coding Law) use BASELINE_WARROOM_M3_PRO instead
# because they were never measurable on dev (dev has no parents_of/degree API,
# and Coding Law workload was never run against dev).

[v2_gates_baselined_against_warroom]
gates = [14, 15]
warroom_commit = "22dbbce"          # research/warroom-experiments commit with final v2.0 attempt
fold_law_ratio_measured = 250        # Exp 20 result, ratio ≥ 100× gate target
coding_law_rho_measured = 0.99       # Exp 18 result, ρ ≥ 0.985 gate target
coding_law_rho_noise_band = 0.005    # run-to-run variance

[package]
name = "koru-lambda-wasm"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
description = "WebAssembly bindings for the koru-lambda-core substrate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swyrknt/koru-lambda-core"
keywords = ["wasm", "content-addressed", "deterministic", "graph"]
categories = ["wasm", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
koru-lambda-core = { path = "../..", version = "=2.0.0", features = ["serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# `serde_bytes` — Uint8Array bridge for wasm-bindgen POJOs. Default
# `serde-wasm-bindgen` serializes `Vec<u8>` as `Array<number>`;
# `#[serde(with = "serde_bytes")]` restores the expected Uint8Array shape.
serde_bytes = "0.11"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

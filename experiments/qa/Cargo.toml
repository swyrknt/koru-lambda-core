[package]
name = "qa_sentinel_experiments"
version = "0.1.0"
edition = "2021"

[dependencies]
koru-lambda-core = { path = "../.." }
dashmap = "6.0"
rand = "0.8"
sha2 = "0.10"

[[bin]]
name = "exp05_phantoms"
path = "src/exp05_phantoms.rs"

[[bin]]
name = "exp06_tearing"
path = "src/exp06_tearing.rs"

[[bin]]
name = "exp08_concurrent_read"
path = "src/exp08_concurrent_read.rs"

[[bin]]
name = "exp09_foreign_id"
path = "src/exp09_foreign_id.rs"

[[bin]]
name = "exp12_log_commutativity"
path = "src/exp12_log_commutativity.rs"

[[bin]]
name = "exp21_cross_engine_determinism"
path = "src/exp21_cross_engine_determinism.rs"

# Validator audit probe (companion to audits/validator.md)
[[bin]]
name = "exp_validator_audit"
path = "src/exp_validator_audit.rs"

# Network audit probes (companion to audits/network.md)
[[bin]]
name = "audit_network_foreign_peers"
path = "src/audit_network_foreign_peers.rs"

[[bin]]
name = "audit_network_commitment_unbound"
path = "src/audit_network_commitment_unbound.rs"

[[bin]]
name = "audit_network_concurrency"
path = "src/audit_network_concurrency.rs"

[profile.release]
opt-level = 3

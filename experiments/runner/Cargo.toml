[package]
name = "koru-experiments-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Reusable workload modules and probe binaries for koru-lambda-core gates. Lives in the experiments/ workspace; not published."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gen_exp18_corpus"
path = "src/bin/gen_exp18_corpus.rs"

[dependencies]
# `version` alongside `path` even though this crate is never published: a
# path-only dependency is `req = "*"` to cargo, which resolves to whatever a
# registry offers the moment anything builds this outside the workspace.
# `scripts/gates/dep_pins.sh` is what noticed.
koru-lambda-core = { path = "../..", version = "=2.0.0" }
# `rand` is pinned at the workspace level (see root Cargo.toml's
# [workspace.dependencies]) so the root crate and this runner cannot
# carry different versions. Per DESIGN.md gate language: corpus files
# are SHA-256-gated; the workspace pin + CORPUS_PROVENANCE.md close
# the "minor version changed Zipf draw sequence" risk together.
rand = { workspace = true }
sha2 = "0.10"
hex = "0.4"

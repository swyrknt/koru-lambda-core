[package]
name = "experiments-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
koru-lambda-core = { path = "../.." }
dhat = "0.3"
crossbeam = "0.8"
rayon = "1.10"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dhat]
inherits = "release"
debug = 1

# Experiment 1: Memory baseline
[[bin]]
name = "exp01_memory"
path = "src/exp01_memory.rs"

# Experiment 2: Invariant sweep
[[bin]]
name = "exp02_invariants"
path = "src/exp02_invariants.rs"

# Experiment 3: Log design A/B
[[bin]]
name = "exp03_log_ab"
path = "src/exp03_log_ab.rs"

# Experiment 7: Replay prototype
[[bin]]
name = "exp07_replay"
path = "src/exp07_replay.rs"

# Experiment 10: Throughput at thread counts
[[bin]]
name = "exp10_throughput"
path = "src/exp10_throughput.rs"

# Experiment 11: String clone cost
[[bin]]
name = "exp11_clone_cost"
path = "src/exp11_clone_cost.rs"

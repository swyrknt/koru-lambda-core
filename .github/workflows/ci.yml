name: CI

# Every branch, every PR. The previous configuration ran only on main and
# dev, so the entire 2.0.0 release branch was never gated.
on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      # Full history, because `checklist_evidence.sh` verifies every commit SHA
      # cited in an evidence line with `git cat-file -e`. `actions/checkout@v4`
      # defaults to `fetch-depth: 1`, so the clone held exactly one commit and
      # every cited SHA — `699a872`, `1e4c6ea`, `57d892f`, and the rest — was
      # reported as nonexistent. Reproduced locally with
      # `git clone --depth 1`: the gate emits one failure per citation.
      #
      # This is why the job has been red since the branch was first gated on
      # 2026-10-11: checkout has always been shallow, so the gate has never
      # once had the history it checks against.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/gates/no_suppression.sh
      - run: ./scripts/gates/crate_boundary.sh
      - run: ./scripts/gates/dep_pins.sh
      - run: ./scripts/gates/no_process_leaks.sh
      - run: ./scripts/gates/checklist_evidence.sh
      - run: ./scripts/gates/doc_anchors.sh
      - run: ./scripts/gates/roadmap.sh
      - run: ./scripts/gates/vectors_frozen.sh
      - run: ./scripts/gates/fixture_coverage.sh
      - run: ./scripts/gates/no_drop_impls.sh
      - run: ./scripts/gates/unsafe_forbidden.sh
      - run: ./scripts/gates/spec_vectors.sh
      - run: ./scripts/gates/reference_impl.sh
      - run: ./scripts/gates/no_consumer_names.sh
      - run: ./scripts/gates/doc_links.sh
      - run: ./scripts/gates/package_links.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native
            args: --workspace --all-targets --all-features
          - name: wasm32
            args: -p koru-lambda-core --target wasm32-unknown-unknown --all-features
          - name: wasm32-bindings
            args: -p koru-lambda-wasm --target wasm32-unknown-unknown --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy ${{ matrix.args }} -- -D warnings

  test:
    name: Tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The debug run matters: `--release` compiles out every
      # `#[cfg(debug_assertions)]` test, which is where the foreign-byte
      # guards live. Running only release silently skipped them.
      - run: cargo test --workspace --all-features ${{ matrix.profile == 'release' && '--release' || '' }}

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets --no-default-features
      - run: cargo check --workspace --all-targets
      - run: cargo check -p koru-lambda-core --all-targets --features serde
      - run: cargo check --workspace --all-targets --all-features

  wasm:
    name: Wasm bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack test --node
        working-directory: crates/koru-lambda-wasm
      - run: wasm-pack build --release --target bundler
        working-directory: crates/koru-lambda-wasm

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.80 (substrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
      # Scoped to the substrate, which is the witness with consumers. The job
      # used to run `--workspace --all-targets --all-features`, which asserts
      # far more than the promise: it builds `koru-lambda-agents` (whose `lru`
      # pulls `hashbrown 0.17`, requiring edition2024 and Rust 1.85) and every
      # dev-dependency, none of which reach a consumer of this crate. It was
      # passing — by whichever versions CI happened to resolve — while
      # asserting the wrong thing, which is the same defect class as a gate
      # that never runs.
      #
      # The workspace-wide check at current stable already exists in the
      # `features` job, so nothing is lost by narrowing this one.
      - run: cargo check -p koru-lambda-core --all-features

  msrv-agents:
    name: MSRV 1.85 (agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      # `crates/koru-lambda-agents/Cargo.toml` declares `rust-version = "1.85"`
      # and records why: its `lru` dependency pulls `hashbrown 0.17`, whose
      # manifest requires `edition2024`. Nothing checked it. Scoping the
      # `msrv` job above to the substrate was right — a workspace-wide 1.80
      # check asserted far more than the substrate's promise — but it left
      # this crate's declared floor with no job behind it, which is the same
      # defect the scoping fixed, one crate over. A declared MSRV nothing
      # verifies is a claim, and this crate's own manifest comment says so
      # about the `1.80` it used to carry.
      - run: cargo check -p koru-lambda-agents --all-features

  loom:
    name: Loom model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test loom_kernel --release
        env:
          RUSTFLAGS: --cfg loom
      # The regression sentinels. Without this step the mutant kernels never
      # execute, so a sentinel that stopped detecting its own bug would be
      # indistinguishable from one that still did.
      - run: cargo test --test loom_kernel --release
        env:
          RUSTFLAGS: --cfg loom --cfg loom_mutant

  miri:
    name: Miri (subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - run: cargo miri test -p koru-lambda-core --lib

  api-surface:
    name: API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `@nightly`. `cargo public-api` reads rustdoc's JSON output,
      # whose format drifts between nightlies — so an unpinned toolchain
      # regenerates the surface in a different shape and the gate fails against
      # a committed artifact that never changed. The committed `api/*.txt` were
      # generated with nightly-2026-06-27; the job has to use the same one or
      # compare two things that were never comparable.
      #
      # Reproducible beats current here: this gate exists to notice a *surface*
      # change, and a date-dependent generator makes every nightly bump look
      # like one. Bumping the pin is a deliberate act that regenerates the
      # snapshot in the same commit, which is exactly the review the gate wants.
      # `@<ref>` is a git ref in the action's repository — `stable`, `nightly`,
      # `master`, or a version tag. A dated nightly is NOT a ref: pinning it as
      # `@nightly-2026-06-27` is a 404 and the job dies at "Set up job", before
      # checkout, which is worse than the drift it was meant to fix. The dated
      # toolchain goes in the `toolchain:` input against `@master`.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-06-27 }
      - run: cargo install cargo-public-api --locked
      - run: ./scripts/gates/api_snapshot.sh

  semver:
    name: Semver check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Against the published baseline. Every lint skips while the bump is
      # major, so this is close to a no-op today; it earns its place once
      # 2.0.0 is out and 2.0.x must not break anyone.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: koru-lambda-core

  supply-chain:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: Package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run -p koru-lambda-core

  examples:
    name: Examples and demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Rust examples
        run: |
          for ex in 01_hello_synth 02_novelty_and_chain 03_projection_composition 04_wire_format_roundtrip; do
            cargo run --quiet --example "$ex"
          done
      - name: JS demos
        working-directory: examples/wasm-demos
        run: |
          npm run build:pkg
          npm install
          npm run typecheck
          npm run demo:all
